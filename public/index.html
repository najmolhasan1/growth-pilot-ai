<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>GrowthPilot AI</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #030303;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 24px;
    }
    .logo {
      width: 68px;
      height: 68px;
      margin-bottom: 20px;
      animation: pulse 2s infinite ease-in-out;
    }
    h1 {
      font-size: 24px;
      font-weight: 900;
      letter-spacing: -0.5px;
      margin-bottom: 8px;
    }
    .gradient-text {
      background: linear-gradient(135deg, #FF4D42, #FF6A3D, #FF8A00);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p {
      color: rgba(255, 255, 255, 0.5);
      font-size: 13px;
      max-width: 280px;
      margin-bottom: 24px;
    }
    .spinner {
      width: 28px;
      height: 28px;
      border: 3px solid rgba(255, 85, 51, 0.15);
      border-top-color: #FF5533;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes pulse { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.05); opacity: 0.85; } }
  </style>
  <script>
    // In Capacitor, if hosted url is loaded via server.url, this serves as native fallback
    if (window.location.protocol === 'file:' || window.location.protocol === 'capacitor:') {
      window.location.replace("https://growthpilot-app.vercel.app");
    }
  </script>
</head>
<body>
  <div class="logo">
    <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect width="40" height="40" rx="12" fill="url(#brand-grad)"/>
      <path d="M21 9L11 23H20L19 31L29 17H20L21 9Z" fill="white" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      <defs>
        <linearGradient id="brand-grad" x1="0" y1="0" x2="40" y2="40" gradientUnits="userSpaceOnUse">
          <stop stop-color="#FF4D42"/>
          <stop offset="0.5" stop-color="#FF6A3D"/>
          <stop offset="1" stop-color="#FF8A00"/>
        </linearGradient>
      </defs>
    </svg>
  </div>
  <h1>Growth<span class="gradient-text">Pilot AI</span></h1>
  <p>Connecting to workspace...</p>
  <div class="spinner"></div>
</body>
</html>
