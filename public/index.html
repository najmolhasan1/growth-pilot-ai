<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>GrowthPilot AI</title>
  <link rel="icon" type="image/png" href="images/favicon.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #030303;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 24px;
    }
    .logo {
      width: 68px;
      height: 68px;
      margin-bottom: 20px;
      animation: pulse 2s infinite ease-in-out;
    }
    h1 {
      font-size: 24px;
      font-weight: 900;
      letter-spacing: -0.5px;
      margin-bottom: 8px;
    }
    .gradient-text {
      background: linear-gradient(135deg, #FF4D42, #FF6A3D, #FF8A00);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p {
      color: rgba(255, 255, 255, 0.5);
      font-size: 13px;
      max-width: 280px;
      margin-bottom: 24px;
    }
    .spinner {
      width: 28px;
      height: 28px;
      border: 3px solid rgba(255, 85, 51, 0.15);
      border-top-color: #FF5533;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes pulse { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.05); opacity: 0.85; } }
  </style>
  <script>
    // In Capacitor, if hosted url is loaded via server.url, this serves as native fallback
    if (window.location.protocol === 'file:' || window.location.protocol === 'capacitor:') {
      window.location.replace("https://growthpilot-app.vercel.app");
    }
  </script>
</head>
<body>
  <div class="logo">
    <img src="images/favicon.png" alt="GrowthPilot AI" style="width: 100%; height: 100%; object-fit: contain;" />
  </div>
  <h1>Growth<span class="gradient-text">Pilot AI</span></h1>
  <p>Connecting to workspace...</p>
  <div class="spinner"></div>
</body>
</html>
